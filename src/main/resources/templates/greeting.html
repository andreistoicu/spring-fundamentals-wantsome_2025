<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Greetings Thymeleaf Example</title>
</head>
<body>
    <h1 th:text="${message}">Welcome</h1>
    <ul>
        <li th:each="item: ${items}" th:text="${item}" > Items </li>
    </ul>
</body>
</html>
