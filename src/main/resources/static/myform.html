<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Form</title>
    </head>
    <body>
        <h3>My form</h3>
        <form action="/submit" method="post">
            <label for="name">Name:</label><br>
            <input type="text" name="name" id="name" required>
            <br><br>

            <label for="message">Message:</label><br>
            <textarea name="message" id="message" rows="4" cols="50" > </textarea>
            <br><br>

            <label>Gender</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male:</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female:</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other:</label>
            <br><br>

            <label>Hobbies</label>
            <input type="checkbox" id="hobby1" name="hobbies" value="travelling">
            <label for="hobby1">Travelling</label>
            <input type="checkbox" id="hobby2" name="hobbies" value="reading">
            <label for="hobby2">Reading</label>
            <input type="checkbox" id="hobby3" name="hobbies" value="coding">
            <label for="hobby3">Coding</label>
            <br><br>

            <button type="submit">Submit data</button>
            <br><br>

        </form>
    </body>
</html>
